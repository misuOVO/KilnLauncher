boot.unsupported_java_version=KilnLauncher 需要 Java 17 或更高版本才能运行，但依然支持使用 Java 6~16 启动游戏。请安装最新版本的 Java 再尝试启动 KilnLauncher。\n你可以继续保留旧版本 Java。KilnLauncher 能够识别与管理多个 Java，并会自动根据游戏版本为你选择合适的 Java。
boot.manual_update=当前版本的 KilnLauncher 不支持自动更新，请手动获取新版本。

