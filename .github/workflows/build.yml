name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        env:
          BUILD_NUMBER: '0'
          VERSION_TYPE: stable
        run: ./gradlew :HMCL:shadowJar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KilnLauncher-jar
          path: HMCL/build/libs/HMCL-*.jar
          if-no-files-found: error

  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          BUILD_NUMBER: '0'
          VERSION_TYPE: stable
        run: ./gradlew.bat :HMCL:makeExecutables --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KilnLauncher-windows
          path: |
            HMCL/build/libs/HMCL-*.exe
            HMCL/build/libs/HMCL-*.exe.sha256
          if-no-files-found: error
